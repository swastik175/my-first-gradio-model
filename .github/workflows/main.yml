name: Sync to hugging face
on:
  push:
    branches: [main]

  # to run this workflow manually from the Actions Tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          # 1. Configure git to store credentials in memory for this job
          git config --global credential.helper store
          
          # 2. Pre-populate the credential store so Git never asks for a username/password
          echo "https://swastik1717:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          
          # 3. Add the clean remote target
          git remote add space https://huggingface.co/spaces/swastik1717/my-first-space
          
          # 4. Safely push without prompt blocks
          git push --force space main
