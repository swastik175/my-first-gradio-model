name: Sync to hugging face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          # 1. Cleanly add the standard HTTPS remote without exposing credentials
          git remote add space https://huggingface.co/spaces/swastik1717/my-first-space
          
          # 2. Inject the Write Token securely using a Git config extra header
          git -c http.extraheader="Authorization: Bearer $HF_TOKEN" push --force space main
