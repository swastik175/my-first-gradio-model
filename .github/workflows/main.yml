name: Sync to hugging face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE }}
        run: |
          git remote set-url origin https://swastik1717:${HF_TOKEN}@huggingface.co/spaces/swastik1717/my-first-space
          git push --force origin main
